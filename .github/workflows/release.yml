name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck and lint
      run: npm run lint

    - name: Run automated tests
      run: npm test

    - name: Build frontend production bundle
      run: npm run build
